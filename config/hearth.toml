# Hearth Configuration File

# Network interface to capture traffic on (e.g., eth0, wlan0, en0)
interface = "eth0"

# Web dashboard HTTP port (accessible at http://127.0.0.1:7777)
dashboard_port = 7777

# Optional: Subnet for active network discovery sweeps (e.g. "192.168.1.0/24")
# If left commented or unset, Hearth auto-detects the local interface subnet
# subnet = "192.168.1.0/24"

# Optional: API key required for sensitive mutating endpoints and dashboard access
# Recommended in production environments to prevent unauthorized network control
# api_key = "secret_auth_token"

# Path to SQLite database file
db_path = "./hearth.db"

# Path to IEEE MAC vendor (OUI) lookup CSV database
oui_db_path = "./oui.csv"

# Path to MaxMind GeoLite2 Country MMDB for destination country lookups
geoip_db_path = "./GeoLite2-Country.mmdb"

# Notification Webhooks (Discord, Slack, or generic HTTP POST) and SIEM Exporter
[notifications]
# webhook_url = "https://discord.com/api/webhooks/YOUR_WEBHOOK_URL"
# Optional Enterprise SIEM / Syslog integration (RFC 5424 or ArcSight CEF via UDP)
# syslog_server = "127.0.0.1:514"
# syslog_format = "rfc5424" # or "cef"
notify_on_anomaly = true
notify_on_new_device = true
notify_on_vulnerability = true
notify_on_malicious_traffic = true
notify_on_arp_spoofing = true
notify_on_rogue_dhcp = true

# Native Cyber Threat Intelligence (CTI) Ingestion & Live C2 Traffic Matching
[threat_intel]
enabled = true
sync_interval_hours = 24
# Automatically isolate/quarantine devices via nftables upon confirmed C2 botnet contact, zero-day DGA, or lateral movement canary trip
auto_quarantine = false
feeds = [
    "https://feodotracker.abuse.ch/downloads/ipblocklist.txt",
    "https://rules.emergingthreats.net/blockrules/compromised-ips.txt",
]

# Native Async DNS Threat Sinkhole & Domain Correlation (Port 53)
[dns]
enabled = true
port = 53
upstream = "1.1.1.1:53"
# Optional: Encrypted DNS-over-HTTPS (DoH) upstream (eliminates ISP unencrypted query snooping)
# doh_upstream = "https://cloudflare-dns.com/dns-query"
blocklists = [
    "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
    "https://urlhaus.abuse.ch/downloads/hostfile/",
]

# Autonomous AI Security Analyst (Hybrid "Reflex + Brain" Architecture)
# Completely OPTIONAL and provider-agnostic / model-agnostic:
# - Leave `enabled = false` to run pure, lightweight deterministic Rust defense (zero AI overhead).
# - Set `enabled = true` to activate AI-driven forensic investigation on detected anomalies.
# - Connects to ANY local inference server (Ollama, vLLM, llama.cpp, SGLang) OR cloud API (OpenAI, Groq, OpenRouter).
# - Completely model-agnostic: use any model class you prefer (3B, 8B, 70B, 80B, 100B+, 405B).
[ai_analyst]
enabled = false
# Universal OpenAI-compatible chat completions endpoint:
# Local examples:
#   endpoint = "http://localhost:11434/v1/chat/completions"     # Ollama
#   endpoint = "http://localhost:8000/v1/chat/completions"      # vLLM / llama.cpp / LocalAI
# Cloud examples:
#   endpoint = "https://api.openai.com/v1/chat/completions"     # OpenAI
#   endpoint = "https://api.groq.com/openai/v1/chat/completions"# Groq
endpoint = "http://localhost:11434/v1/chat/completions"

# Model name: Choose any model size or provider:
# Local: "llama3.3:70b", "deepseek-r1:70b", "qwen2.5:72b", "mistral:latest", "llama-3.1:405b"
# Cloud: "gpt-4o", "claude-3-5-sonnet", "llama-3.3-70b-versatile"
model = "llama3.3:70b"

# API Key (leave empty for open local servers like Ollama/llama.cpp; fill for cloud APIs)
# api_key = "sk-..."

# Timeout in seconds (accommodates heavy 70B-100B+ reasoning chains)
timeout_seconds = 60

# Autonomous action switch:
# - false: AI performs forensic reasoning and alert enrichment only (manual admin approval required).
# - true: AI can trigger proactive quarantine within strict deterministic guardrails.
autonomous_action = false

# Minimum AI confidence score (0.0 to 1.0) required before any autonomous action is permitted
confidence_threshold = 0.85

# Static list of protected MAC addresses the AI is strictly forbidden from ever isolating
# (e.g. administrator laptops, core hypervisors, NAS)
protected_macs = [
    # "00:11:22:33:44:55",
]

# Friendly device names and soft-blocking enforcement rules
# [[devices]]
# mac = "AA:BB:CC:DD:EE:FF"
# label = "Living Room Samsung TV"
# max_upload_per_hour_mb = 500.0
# block_hours = ["23:00", "06:00"]       # Block internet during sleep hours
# allow_domains = ["netflix.com", "samsungcloud.com"]
